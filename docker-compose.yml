version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: garage_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garagepassword
      POSTGRES_DB: garage
    ports:
      - "5433:5432"
    volumes:
      - garage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  garage_pgdata:
